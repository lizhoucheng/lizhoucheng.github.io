---
layout: default
---
<article>
  <a class="back" href="{{ '/' | relative_url }}">← All writing</a>
  <header class="post-header"><p class="eyebrow"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>{% if page.categories.size > 0 %} · {{ page.categories | join: ' / ' | escape }}{% endif %}</p><h1>{{ page.title | escape }}</h1>{% if page.description %}<p class="lede">{{ page.description | escape }}</p>{% endif %}</header>
  <div class="prose">{{ content }}</div>
</article>
